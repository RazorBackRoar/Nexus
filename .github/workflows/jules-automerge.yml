name: Jules Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]   # Exact name of quality workflow
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Squash-merge Jules PRs
    if: >
      github.event.workflow_run.conclusion == "success" &&
      github.event.workflow_run.event == "pull_request" &&
      (
        startsWith(github.event.workflow_run.head_branch, "sentinel-") ||
        startsWith(github.event.workflow_run.head_branch, "bolt-") ||
        startsWith(github.event.workflow_run.head_branch, "palette-")
      )
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge Jules PR after CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open --json number -q ".[0].number")
          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            echo "Merging PR #$pr_number on $HEAD_BRANCH..."
            gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch
          else
            echo "No open PR found for branch $HEAD_BRANCH"
          fi

