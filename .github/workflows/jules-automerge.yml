name: Jules Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-automerge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Squash-merge low-risk Jules PRs
    if: >
      github.event.repository.visibility == "public" &&
      github.event.workflow_run.conclusion == "success" &&
      github.event.workflow_run.event == "pull_request" &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, "routine-")
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge eligible routine PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find open PR matching the branch
          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open --json number,baseRefName,headRepositoryOwner,author,isDraft -q '
            .[]
            | select(
                .baseRefName == "main" and
                .headRepositoryOwner.login == "RazorBackRoar" and
                .author.login == "RazorBackRoar" and
                .isDraft == false
              )
            | .number' | head -n 1)

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No eligible routine PR found for branch $HEAD_BRANCH."
            exit 0
          fi

          pr_head_sha=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json headRefOid -q '.headRefOid')
          if [ "$pr_head_sha" != "$HEAD_SHA" ]; then
            echo "PR #$pr_number changed after CI; skipping."
            exit 0
          fi

          deletions=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json deletions -q '.deletions')
          if [ "$deletions" -ne 0 ]; then
            echo "PR #$pr_number deletes files or lines; manual review required."
            exit 0
          fi

          changed_files=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json files -q '.files[].path')
          while IFS= read -r path; do
            case "$path" in
              README.md|CHANGELOG.md|docs/*|tests/*|Tests/*|test/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *)
                echo "PR #$pr_number changes non-routine path: $path"
                exit 0
                ;;
            esac
          done <<< "$changed_files"

          echo "Enabling auto-merge for low-risk PR #$pr_number on branch $HEAD_BRANCH..."
          gh pr merge "$pr_number" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch \
            --auto \
            --match-head-commit "$HEAD_SHA"
