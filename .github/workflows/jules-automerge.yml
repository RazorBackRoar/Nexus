name: Jules Auto-Merge

# Phase 0+1 — see Apps/Docs/jules/README.md and jules-automerge-guide.md
#
# Phase 0: sentinel-/bolt-/palette- are NOT auto-merged (require human review
#          until risk-gate exists in Phase 2).
# Phase 1: eligibility is the manual label `jules-automerge-approved`.
#          Tier 1 only: no deletions + docs/tests/template path allowlist.
#          Job-level concurrency; gh pr merge --auto; hourly reconciliation.
#
# Requires (Settings → General → Pull Requests):
#   - Allow auto-merge
#   - Automatically delete head branches
#
# Canonical copy: Apps/Docs/jules/workflows/jules-automerge.yml

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # Hourly reconciliation for labeled PRs waiting on --auto / stale main.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Squash-merge eligible Jules PRs
    # Run on successful PR CI, or on schedule / manual reconcile.
    # Prefix filters removed (Phase 0). Label + Tier-1 path checks happen in-script.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    concurrency:
      group: jules-automerge-${{ github.repository }}-${{ github.event.workflow_run.head_branch || 'reconcile' }}
      cancel-in-progress: false
    steps:
      - name: Squash-merge eligible Jules PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          ELIGIBILITY_LABEL: jules-automerge-approved
        run: |
          set -euo pipefail

          skip() {
            echo "skip: $*"
          }

          is_tier1_paths() {
            local pr_number="$1"
            local deletions changed_files path

            deletions=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json deletions -q '.deletions')
            if [ "$deletions" -ne 0 ]; then
              skip "PR #$pr_number has deletions ($deletions); Tier 1 forbids deletions"
              return 1
            fi

            changed_files=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json files -q '.files[].path')
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                README.md|CHANGELOG.md|SECURITY.md|CODE_OF_CONDUCT.md|docs/*|Docs/*|tests/*|Tests/*|test/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                  ;;
                *)
                  skip "PR #$pr_number changes non-Tier-1 path: $path"
                  return 1
                  ;;
              esac
            done <<< "$changed_files"
            return 0
          }

          try_merge_pr() {
            local pr_number="$1"
            local expected_sha="${2:-}"
            local labels base_ref is_draft head_sha mergeable state

            labels=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json labels -q '.labels[].name')
            if ! grep -qx "$ELIGIBILITY_LABEL" <<< "$labels"; then
              skip "PR #$pr_number missing label '$ELIGIBILITY_LABEL'"
              return 0
            fi

            base_ref=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json baseRefName -q '.baseRefName')
            if [ "$base_ref" != "main" ]; then
              skip "PR #$pr_number base is '$base_ref', not main"
              return 0
            fi

            is_draft=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json isDraft -q '.isDraft')
            if [ "$is_draft" = "true" ]; then
              skip "PR #$pr_number is draft"
              return 0
            fi

            head_sha=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json headRefOid -q '.headRefOid')
            if [ -n "$expected_sha" ] && [ "$head_sha" != "$expected_sha" ]; then
              skip "PR #$pr_number head moved after CI ($head_sha != $expected_sha)"
              return 0
            fi

            if ! is_tier1_paths "$pr_number"; then
              return 0
            fi

            # Prefer green required checks; --auto waits if something is still pending.
            state=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json mergeable,state -q '[.mergeable,.state] | @tsv')
            mergeable=$(cut -f1 <<< "$state")
            pr_state=$(cut -f2 <<< "$state")
            if [ "$pr_state" != "OPEN" ]; then
              skip "PR #$pr_number state is $pr_state"
              return 0
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              skip "PR #$pr_number has merge conflicts"
              return 0
            fi

            echo "Merging eligible Jules PR #$pr_number (sha=$head_sha)..."
            if gh pr merge "$pr_number" \
              --repo "$REPOSITORY" \
              --squash \
              --delete-branch \
              --auto \
              --match-head-commit "$head_sha"; then
              echo "enqueued/merged PR #$pr_number"
            else
              skip "PR #$pr_number merge --auto failed (may already be enqueued, blocked, or stale)"
            fi
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ -z "$HEAD_BRANCH" ]; then
              skip "workflow_run missing head branch"
              exit 0
            fi

            pr_number=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open \
              --json number,headRepositoryOwner \
              --jq '[.[]
                | select(.headRepositoryOwner.login == "RazorBackRoar")
                | .number] | .[0] // empty')

            if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
              skip "no open same-owner PR for branch $HEAD_BRANCH"
              exit 0
            fi

            try_merge_pr "$pr_number" "$HEAD_SHA"
            exit 0
          fi

          # schedule / workflow_dispatch — reconcile all labeled open PRs
          echo "Reconciling open PRs with label '$ELIGIBILITY_LABEL'..."
          pr_numbers=$(gh pr list --repo "$REPOSITORY" --state open --limit 100 \
            --json number,labels,headRepositoryOwner \
            --jq '[.[]
              | select(.headRepositoryOwner.login == "RazorBackRoar")
              | select(any(.labels[]; .name == "jules-automerge-approved"))
              | .number] | .[]')

          if [ -z "$pr_numbers" ]; then
            skip "no open PRs with label '$ELIGIBILITY_LABEL'"
            exit 0
          fi

          while IFS= read -r pr_number; do
            [[ -z "$pr_number" ]] && continue
            try_merge_pr "$pr_number" ""
          done <<< "$pr_numbers"
