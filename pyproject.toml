# ============================================================================
# NEXUS - DESKTOP APPLICATION
# ============================================================================
# This pyproject.toml follows RazorBackRoar workspace standards
# Last Updated: 2026-01-28
# Python Version: 3.14 primary (best-effort source compatibility 3.14)
# ============================================================================

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]

[project]
name = "nexus"
version = "2.0.0"
description = "Nexus desktop bookmark and URL manager"
requires-python = "==3.14.*"
# WHY: Native dev/build target is 3.14, with source compatibility for 3.14.

dependencies = [
    "PySide6>=6.6.0,<7.0.0",
    "Pillow>=10.0.0",
    "razorcore>=1.211.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nexus"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.src]
exclude = [
    ".agent/**",
    ".shared/**",
]

[tool.ty.environment]
extra-paths = [
    "src",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.uv]
# Public CI and Dependabot resolve razorcore from the committed vendor wheel.
find-links = ["ci/vendor"]

# Pinned so GitHub CI matches local workspace ruff (ruff 0.16+ defaults
# otherwise enable isort I001 and extra rule families).
[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "W", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "B905"]
"__init__.py" = ["F401"]
"**/gui/**/*.py" = ["N802"]
"**/widgets.py" = ["N802"]
"**/main.py" = ["E402"]
"**/__main__.py" = ["E402"]
"**/.github/scripts/*.py" = ["E402", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["razorcore", "nexus"]
lines-after-imports = 2
